name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Frontend build ────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Optimize images
        working-directory: frontend
        run: npm run optimize:images

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://easyacct.us

      # ── Backend build ─────────────────────────────────────────────────
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysql, openssl, tokenizer, xml, ctype, json, fileinfo, bcmath, curl
          coverage: none
          tools: composer:v2

      - name: Install Composer deps (prod)
        working-directory: backend
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      # ── Stage server tree ─────────────────────────────────────────────
      - name: Stage server tree
        run: |
          set -euo pipefail
          mkdir -p stage/_laravel stage/api
          rsync -a \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='database/database.sqlite' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/testing/*' \
            backend/ stage/_laravel/
          mkdir -p stage/_laravel/storage/framework/{cache/data,sessions,views,testing}
          mkdir -p stage/_laravel/storage/logs
          touch stage/_laravel/storage/framework/cache/data/.gitkeep
          touch stage/_laravel/storage/framework/sessions/.gitkeep
          touch stage/_laravel/storage/framework/views/.gitkeep
          touch stage/_laravel/storage/logs/.gitkeep
          cp -r deploy/api/. stage/api/

      # ── Set up SSH key ────────────────────────────────────────────────
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 145.79.28.98 >> ~/.ssh/known_hosts 2>/dev/null

      # ── Upload via rsync over SSH ─────────────────────────────────────
      - name: Upload frontend → public_html/
        run: |
          rsync -az --no-perms --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no" \
            --exclude='_laravel/' --exclude='api/' \
            frontend/dist/ \
            u841016234@145.79.28.98:~/public_html/

      - name: Upload Laravel → public_html/_laravel/
        run: |
          rsync -az --no-perms --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no" \
            --exclude='.env' \
            stage/_laravel/ \
            u841016234@145.79.28.98:~/public_html/_laravel/

      - name: Upload API front controller → public_html/api/
        run: |
          rsync -az --no-perms --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no" \
            stage/api/ \
            u841016234@145.79.28.98:~/public_html/api/

      # ── Fix permissions + run migrations via SSH ──────────────────────
      - name: Fix storage permissions & run migrations
        run: |
          ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no \
            u841016234@145.79.28.98 << 'ENDSSH'
            set -e
            DOCROOT=~/public_html
            chmod -R 775 $DOCROOT/_laravel/storage
            chmod -R 775 $DOCROOT/_laravel/bootstrap/cache
            cd $DOCROOT/_laravel
            php artisan config:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
          ENDSSH
